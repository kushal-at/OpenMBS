name: CI & Release Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run -p openmbs-cli --locked -- peb-demo output/demo-test

  build-windows-x64:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Package Windows x64 Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/openmbs-windows-x64 -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/openmbs.exe dist/openmbs-windows-x64/
          Copy-Item target/x86_64-pc-windows-msvc/release/openmbs-desktop.exe dist/openmbs-windows-x64/
          Copy-Item README.md dist/openmbs-windows-x64/
          Copy-Item LICENSE dist/openmbs-windows-x64/
          Copy-Item -Recurse examples dist/openmbs-windows-x64/
          Compress-Archive -Path dist/openmbs-windows-x64/* -DestinationPath dist/openmbs-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: openmbs-windows-x64
          path: dist/openmbs-windows-x64.zip
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openmbs-windows-x64.zip

  build-windows-arm64:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: cargo build --workspace --release --locked --target aarch64-pc-windows-msvc
      - name: Package Windows ARM64 Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/openmbs-windows-arm64 -Force
          Copy-Item target/aarch64-pc-windows-msvc/release/openmbs.exe dist/openmbs-windows-arm64/
          Copy-Item target/aarch64-pc-windows-msvc/release/openmbs-desktop.exe dist/openmbs-windows-arm64/
          Copy-Item README.md dist/openmbs-windows-arm64/
          Copy-Item LICENSE dist/openmbs-windows-arm64/
          Copy-Item -Recurse examples dist/openmbs-windows-arm64/
          Compress-Archive -Path dist/openmbs-windows-arm64/* -DestinationPath dist/openmbs-windows-arm64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: openmbs-windows-arm64
          path: dist/openmbs-windows-arm64.zip
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openmbs-windows-arm64.zip
